<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy Steps 1 – Unit 2: Tuổi tác & Số điện thoại</title>
<style>
:root{--bg:#eaf3fb;--card:#fff;--ink:#14213d;--mut:#5c6b88;--red:#e63946;--jade:#1b9e77;--gold:#ffb703;--line:#cfdceb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1830;--card:#19264a;--ink:#eef3ff;--mut:#9fb0d3;--line:#2c3c66}}
:root[data-theme="dark"]{--bg:#0f1830;--card:#19264a;--ink:#eef3ff;--mut:#9fb0d3;--line:#2c3c66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body.nopy .py{display:none}
h1{font-size:26px;margin:0;line-height:1.2}h2{font-size:20px;margin:0 0 6px}
.sub,.xp{color:var(--mut);margin:4px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tg{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:6px 14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:16px 0;border:2px solid var(--line)}
.note{background:color-mix(in srgb,var(--gold) 25%,var(--card));border-radius:10px;padding:8px 12px;margin:8px 0 12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.lv{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px}
.lv b{font-size:22px}.lv em{font-style:normal;color:var(--gold)}
.lv.boss{border-color:var(--red)}.lv:disabled{opacity:.45;cursor:not-allowed}
.badges{display:flex;gap:8px;flex-wrap:wrap}.bd{background:var(--gold);color:#14213d;border-radius:20px;padding:4px 12px;font-size:14px;font-weight:700}
.top{display:flex;align-items:center;gap:10px}
.ghost{background:none;border:2px solid var(--line);border-radius:12px;padding:0 12px}
.bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--jade);transition:width .3s}
.q{font-size:18px;margin:18px 0 4px}
.big{font-size:56px;text-align:center;line-height:1.25;margin:8px 0}.big small{display:block;font-size:18px;color:var(--mut)}
.big.s{font-size:30px}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:20px;text-align:left}
.opt.right{border-color:var(--jade);background:color-mix(in srgb,var(--jade) 20%,var(--card))}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 20%,var(--card))}
.slot,.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:6px;margin-top:10px;border-radius:12px}
.slot{border:2px dashed var(--line)}
.chip{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 14px;font-size:22px}
.mm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mm button{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;font-size:18px;margin-bottom:8px;width:100%}
.mm .zh{font-size:28px}.mm .py{display:block;font-size:13px;color:var(--mut)}
.mm .sel{border-color:var(--gold)}.mm .ok{border-color:var(--jade);opacity:.5}.mm .no{border-color:var(--red)}
.fb{margin-top:16px;padding:14px;border-radius:14px}
.fb.good{background:color-mix(in srgb,var(--jade) 22%,var(--card))}.fb.bad{background:color-mix(in srgb,var(--red) 20%,var(--card))}
.fb p{margin:6px 0 10px}
.go{background:var(--red);color:#fff;border:0;border-radius:12px;padding:10px 22px;font-weight:700;margin-top:12px}
.go.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.res{text-align:center}.stars{font-size:48px;color:var(--gold)}
.inp{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:20px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
#rp{width:100%;box-sizing:border-box;min-height:300px;font:14px/1.5 ui-monospace,monospace;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body><div id="app"></div>
<script>
/* ===== DỮ LIỆU (lấy từ giáo trình Unit 2, Lesson 5 + 6) ===== */
const W5=[["在","zài","ở, vào lúc"],["出生","chūshēng","sinh ra"],["的","de","của"],["生日","shēngrì","sinh nhật"],["多大","duō dà","bao nhiêu tuổi"],["了","le","trợ từ (đã)"],["他","tā","anh ấy"],["她","tā","cô ấy"],["岁","suì","tuổi"],["几岁","jǐ suì","mấy tuổi"],["王","wáng","họ Vương"],["文","wén","văn hóa"]];
const W6=[["家","jiā","nhà"],["电话","diànhuà","điện thoại"],["号码","hàomǎ","số hiệu"],["多少","duōshao","bao nhiêu"],["住","zhù","ở, sống"],["哪儿","nǎr","ở đâu"],["北京","Běijīng","Bắc Kinh"],["上海","Shànghǎi","Thượng Hải"],["伦敦","Lúndūn","Luân Đôn"],["东京","Dōngjīng","Tokyo"],["纽约","Niǔyuē","New York"],["巴黎","Bālí","Paris"],["香港","Xiānggǎng","Hồng Kông"]];
const RA5=[["今","人","người"],["每","𠂉","người nằm"],["明","日","mặt trời"],["服","月","thịt"],["岁","山","núi"],["现","王","ngọc"]];
const RA6=[["语","讠","lời nói"],["码","石","đá"],["常","小","nhỏ"],["的","白","trắng"],["都","阝","tai"],["级","纟","tơ"]];
const F5=[["我 ___ 一九九二年出生。","在",["住","的","了"]],["小文九岁 ___。","了",["的","在","是"]],["他十三岁了。王星 ___ 了？","多大",["几岁","多少","哪儿"]],["我 ___ 生日是三月十号。","的",["了","在","岁"]]];
const F6=[["你家的电话号码是 ___？","多少",["几岁","哪儿","多大"]],["你 ___ 在哪儿？","住",["在","的","了"]],["他住在 ___？","哪儿",["多少","几岁","多大"]],["你家 ___ 电话号码是多少？","的",["了","在","住"]]];
const S5=[[["他","几","岁","了"],"Cậu ấy mấy tuổi rồi?"],[["王星","多大","了"],"Vương Tinh bao nhiêu tuổi rồi?"],[["我的","生日","是","三月","十号"],"Sinh nhật tôi là ngày 10 tháng 3."],[["今天","星期","几"],"Hôm nay thứ mấy?"],[["她","九岁","了"],"Cô ấy 9 tuổi rồi."],[["你的","生日","是","几月","几号"],"Sinh nhật bạn là ngày mấy tháng mấy?"]];
const S6=[[["你","家","的","电话号码","是","多少"],"Số điện thoại nhà bạn là bao nhiêu?"],[["你","住","在","哪儿"],"Bạn sống ở đâu?"],[["我","住","在","北京"],"Tôi sống ở Bắc Kinh."],[["他","住","在","哪儿"],"Anh ấy sống ở đâu?"],[["她","住","在","上海"],"Cô ấy sống ở Thượng Hải."]];
const ST=[["您","trên – dưới"],["师","trái – phải"],["字","trên – dưới"],["老","trên – dưới"],["还","bao quanh"],["谢","trái – phải"]];
const D={5:{W:W5,RA:RA5,F:F5,S:S5},6:{W:W6,RA:RA6,F:F6,S:S6}};
const A=[3,4,5,6,7,8,9,11,12,13,15,20,35,40];
const WD=["日","一","二","三","四","五","六"];
const PY=["líng","yī","èr","sān","sì","wǔ","liù","qī","bā","jiǔ"];
const DG="〇一二三四五六七八九";

/* ===== HÀM TIỆN ÍCH ===== */
const $=s=>document.querySelector(s);
const R=a=>a[Math.random()*a.length|0];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cn=n=>n<10?DG[n]:n<20?"十"+(n%10?DG[n%10]:""):DG[n/10|0]+"十"+(n%10?DG[n%10]:"");
const wd=x=>"星期"+WD[(x+4)%7]; // 2/9/2006 là thứ Bảy
const pick=(arr,a,k=3)=>sh([...new Set(arr)].filter(x=>x!==a)).slice(0,k);
const mk=(q,a,wr,tip,big,py,sm)=>({t:"c",q,a,o:sh([a,...wr.slice(0,3)]),tip,big,py,sm});

/* ===== BỘ SINH CÂU HỎI ===== */
const G={
 vm:L=>{const W=D[L].W,w=R(W);return mk("Nghĩa của từ này là gì?",w[2],pick(W.map(x=>x[2]),w[2]),`${w[0]} (${w[1]}) = ${w[2]}`,w[0],w[1])},
 pm:L=>{const W=D[L].W,w=R(W);return mk("Chọn pinyin đúng:",w[1],pick(W.map(x=>x[1]),w[1]),`${w[0]} đọc là ${w[1]}`,w[0])},
 tf:L=>{const W=D[L].W,w=R(W),ok=Math.random()<.5,m=ok?w[2]:R(W.filter(x=>x[2]!==w[2]))[2];
  return mk("Đúng hay sai?",ok?"Đúng":"Sai",[ok?"Sai":"Đúng"],`${w[0]} (${w[1]}) = ${w[2]}`,`${w[0]} = ${m}`,"",1)},
 m:L=>({t:"m",p:sh(D[L].W).slice(0,5)}),
 age:()=>{const a=R(A);return mk(`Người này ${a} tuổi. Hỏi tuổi người này, dùng từ nào?`,a<10?"几岁":"多大",[a<10?"多大":"几岁"],"几岁 hỏi trẻ dưới 10 tuổi; 多大 hỏi người trên 10 tuổi.","他 ___ 了？","",1)},
 qa:()=>{const a=R(A);return mk(`他${a<10?"几岁":"多大"}了？ Người này ${a} tuổi. Trả lời:`,`他${cn(a)}岁了。`,pick(A,a).map(x=>`他${cn(x)}岁了。`),`他${cn(a)}岁了。`)},
 cal:()=>{const d=2+Math.random()*26|0,r=Math.random(),tip="Lịch tháng 9/2006: ngày 2 là 星期六.";
  if(r<.34)return mk(`今天是九月${cn(d)}号。明天星期几？`,wd(d+1),pick([0,1,2,3,4,5,6].map(x=>wd(x+2)),wd(d+1)),tip);
  if(r<.67)return mk(`今天是九月${cn(d)}号。昨天几月几号？`,`九月${cn(d-1)}号`,[d+1,d+2,d-2].filter(x=>x>0).map(x=>`九月${cn(x)}号`),tip);
  return mk(`今天是九月${cn(d)}号。今天星期几？`,wd(d),pick([0,1,2,3,4,5,6].map(x=>wd(x+2)),wd(d)),tip)},
 ph:()=>{const d=[...Array(8)].map(()=>Math.random()*10|0);d[0]=2+Math.random()*8|0;d[1+Math.random()*7|0]=1;
  const rd=(a,y)=>[a.slice(0,4),a.slice(4)].map(g=>g.map(n=>n==1?(y?"yī":"yāo"):PY[n]).join(" ")).join(" | ");
  const sw=d.slice(),i=1+Math.random()*6|0;[sw[i],sw[i+1]]=[sw[i+1],sw[i]];if(sw.join()==d.join())sw[i]=(sw[i]+1)%10;
  const c=d.slice();c[7]=(c[7]+3)%10;const ans=rd(d,0),big=d.slice(0,4).join("")+" "+d.slice(4).join("");
  return mk("Chọn cách đọc số điện thoại đúng:",ans,pick([rd(d,1),rd(sw,0),rd(c,0)],ans),`${big} → ${ans}. Trong số điện thoại, số 1 đọc là yāo.`,big,"",1)},
 seq:()=>{const m=1+Math.random()*6|0,it=[m,m+2,m+4,m+6].map(cn).join("、")+"、？",a=cn(m+8);
  return mk("Điền số tiếp theo của dãy:",a,[cn(m+7),cn(m+9),cn(m+10)],`Dãy tăng 2 mỗi lần → ${a}`,it,"",1)},
 city:()=>{const C=W6.slice(6),c=R(C);return mk(`Người này sống ở ${c[2]}. Trả lời cho 他住在哪儿？`,`他住在${c[0]}。`,pick(C.map(x=>`他住在${x[0]}。`),`他住在${c[0]}。`),`他住在${c[0]}。(${c[1]})`)},
 fl:L=>{const x=R(D[L].F);return mk("Chọn từ điền vào chỗ trống:",x[1],x[2],x[0].replace("___",x[1]),x[0],"",1)},
 rad:L=>{const RA=D[L].RA,x=R(RA),f=r=>`${r[1]} (${r[2]})`;return mk("Bộ thủ của chữ này là gì?",f(x),pick(RA.map(f),f(x)),`${x[0]}: bộ ${x[1]} (${x[2]})`,x[0])},
 st:()=>{const x=R(ST);return mk("Chữ này có cấu trúc nào?",x[1],pick(["trái – phải","trên – dưới","bao quanh"],x[1],2),`${x[0]}: ${x[1]}`,x[0])},
 ord:L=>{const s=R(D[L].S);return {t:"o",w:sh(s[0]),a:s[0].join(""),vi:s[1],tip:s[0].join("")+" — "+s[1]}}
};
const M8=["m","vm","vm","tf","vm","tf","vm","m"],P8=Array(8).fill("pm");
const LV={5:[["Từ mới",M8],["Pinyin",P8],["Hỏi tuổi",["age","age","qa","age","qa","fl","qa","age"]],["Ngày tháng",Array(8).fill("cal")],["Ghép câu",["ord","ord","ord","ord","fl","ord"]],["Bộ thủ",Array(8).fill("rad")],["Boss",["vm","pm","age","qa","cal","cal","ord","rad","fl","tf"]]],
 6:[["Từ mới",M8],["Pinyin",P8],["Số điện thoại",["ph","ph","ph","ph","ph","seq","seq","ph"]],["Nơi ở",["city","city","fl","city","fl","city","city","ord"]],["Ghép câu",["ord","ord","ord","ord","fl","ord"]],["Bộ thủ & cấu trúc",["rad","st","rad","st","st","rad","st","rad"]],["Boss",["vm","pm","ph","seq","city","fl","ord","rad","st","tf"]]]};
const SG=["vm","pm","age","qa","cal","ph","city","fl","tf","rad","seq"];

/* ===== LƯU TIẾN ĐỘ ===== */
let DB={users:{},cur:"",py:true,hard:false};
try{const j=JSON.parse(localStorage.getItem("es1u2b"));if(j&&j.users)DB=Object.assign(DB,j)}catch(e){}
let S={},st=null;
const save=()=>{try{localStorage.setItem("es1u2b",JSON.stringify(DB))}catch(e){}};
function use(n){DB.cur=n;S=DB.users[n]=DB.users[n]||{};S.done=S.done||{};S.acc=S.acc||{};S.xp=S.xp||0;S.streak=S.streak||0;save()}
if(DB.cur&&DB.users[DB.cur])use(DB.cur);else DB.cur="";

/* ===== MÀN HÌNH CHÍNH ===== */
function home(){
 if(st)clearInterval(st.iv);
 if(!DB.cur)return login();
 document.body.classList.toggle("nopy",!DB.py);
 const dn=k=>(S.done[k]||0)>=1,stars=k=>"★".repeat(S.done[k]||0)+"☆".repeat(3-(S.done[k]||0));
 const note={5:"多大 hỏi tuổi người trên 10 tuổi · 几岁 hỏi tuổi trẻ dưới 10 tuổi.",6:"Trong số điện thoại, số 1 đọc là yāo (一 → yāo)."};
 const bd=[];if((S.done["5-2"]||0)>=3)bd.push("Chuyên gia hỏi tuổi");if((S.done["6-2"]||0)>=3)bd.push("Bậc thầy số điện thoại");if((S.done.u||0)>=3)bd.push("Siêu tốc Unit 2");
 let h=`<h1>Unit 2 · Tuổi tác & Số điện thoại</h1><p class="sub">Easy Steps to Chinese 1 · Bài 5 + Bài 6</p>
 <p class="sub">👤 Học sinh: <b>${DB.cur}</b></p>
 <div class="tools"><button class="tg" onclick="DB.py=!DB.py;save();home()">Pinyin: ${DB.py?"bật":"tắt"}</button><button class="tg" onclick="DB.hard=!DB.hard;save();home()">Chế độ: ${DB.hard?"Thử thách (3 ❤️)":"Luyện tập (không mất tim)"}</button><button class="tg" onclick="report()">📋 Báo cáo điểm</button><button class="tg" onclick="DB.cur='';save();home()">Đổi học sinh</button><button class="tg" onclick="resetMe()">Làm lại từ đầu</button></div>
 <p class="xp">⭐ ${S.xp} XP · 🔥 ${S.streak} ngày liên tiếp</p>${bd.length?`<div class="badges">${bd.map(b=>`<span class="bd">🏅 ${b}</span>`).join("")}</div>`:""}`;
 for(const L of [5,6]){
  h+=`<section class="card"><h2>Bài ${L} · ${L==5?"年龄 Tuổi tác":"电话号码 Số điện thoại"}</h2><div class="note">${note[L]}</div><div class="grid">`;
  LV[L].forEach((v,i)=>{const lock=i>0&&!dn(L+"-"+(i-1));
   h+=`<button class="lv ${i==6?"boss":""}" ${lock?"disabled":""} onclick="play(${L},${i})"><b>${i==6?"👹":i+1}</b><span>${v[0]}</span><em>${lock?"🔒":stars(L+"-"+i)}</em></button>`});
  h+=`</div></section>`}
 const ul=dn("5-6")&&dn("6-6");
 h+=`<section class="card"><h2>Boss chung · Tốc độ 60 giây</h2><div class="note">Trả lời càng nhiều càng tốt, trúng liên tiếp để nhân combo. Điểm cao nhất: ${S.best||0}</div><button class="lv boss" style="width:100%" ${ul?"":"disabled"} onclick="speed()"><b>⚡</b><span>${ul?"Bắt đầu":"Thắng Boss Bài 5 và Bài 6 để mở khóa"}</span><em>${stars("u")}</em></button></section>`;
 $("#app").innerHTML=h;scrollTo(0,0)}

/* ===== ĐIỀU KHIỂN LƯỢT CHƠI ===== */
function play(L,i){run(LV[L][i][1].map(g=>G[g](L)),{key:L+"-"+i,again:()=>play(L,i)})}
function speed(){run([],{speed:1,key:"u",again:speed})}
function run(qs,o){
 if(st)clearInterval(st.iv);
 st={qs,i:0,ok:0,hp:DB.hard&&!o.speed&&!o.review?3:99,hard:DB.hard&&!o.speed&&!o.review,combo:0,miss:[],pts:0,t:60,o,speed:o.speed};
 if(o.speed)st.iv=setInterval(()=>{st.t--;const e=$("#tm");if(e)e.textContent=st.t+"s";const b=$(".bar i");if(b)b.style.width=(60-st.t)/60*100+"%";if(st.t<=0)end()},1000);
 show()}
function quit(){if(confirm("Thoát màn chơi? Tiến độ màn này sẽ không được lưu."))home()}
function show(){
 if(st.speed&&!st.qs[st.i])st.qs[st.i]=G[R(SG)](R([5,6]));
 if((!st.speed&&st.i>=st.qs.length)||st.hp<=0)return end();
 const q=st.q=st.qs[st.i];st.lock=false;
 const pr=st.speed?(60-st.t)/60:st.i/st.qs.length;
 let h=`<div class="top"><button class="ghost" onclick="quit()" aria-label="Thoát">✕</button><div class="bar"><i style="width:${pr*100}%"></i></div><span>${st.hard?"❤️".repeat(st.hp):""}</span>${st.speed?`<b id="tm">${st.t}s</b><b>${st.pts}đ</b>`:""}</div><main>`;
 if(q.t=="c"){
  h+=`<p class="q">${q.q}</p>${q.big?`<div class="big ${q.sm?"s":""}">${q.big}${q.py?`<small class="py">${q.py}</small>`:""}</div>`:""}<div class="opts">${q.o.map((o,k)=>`<button class="opt" onclick="pickC(${k})">${o}</button>`).join("")}</div>`}
 if(q.t=="o"){
  st.pk=[];h+=`<p class="q">Sắp xếp thành câu: <i>${q.vi}</i></p><div id="ans" class="slot"></div><div id="pool" class="pool"></div><button class="go" onclick="chkO()">Kiểm tra</button>`}
 if(q.t=="m"){
  st.sel=null;st.n=0;st.mm=0;st.ls=sh(q.p.map((_,k)=>k));st.rs=sh(q.p.map((_,k)=>k));
  h+=`<p class="q">Nối chữ Hán với nghĩa tiếng Việt:</p><div class="mm"><div>${st.ls.map(k=>`<button id="l${k}" onclick="selM(${k})"><span class="zh">${q.p[k][0]}</span><span class="py">${q.p[k][1]}</span></button>`).join("")}</div><div>${st.rs.map(k=>`<button id="r${k}" onclick="mtch(${k})">${q.p[k][2]}</button>`).join("")}</div></div>`}
 $("#app").innerHTML=h+"</main>";
 if(q.t=="o")drawO()}
function res(ok,q,tip){
 if(st.lock)return;st.lock=true;
 if(ok){st.ok++;st.combo++;st.pts+=10+Math.min(st.combo,5)*2}else{st.combo=0;st.miss.push(q);if(st.hard)st.hp--}
 if(st.speed){setTimeout(()=>{st.i++;show()},ok?250:800);return}
 $("main").insertAdjacentHTML("beforeend",`<div class="fb ${ok?"good":"bad"}"><b>${ok?"Đúng rồi!"+(st.combo>2?" 🔥 combo ×"+st.combo:""):"Chưa đúng"}</b><p>${tip||""}</p><button class="go" onclick="st.i++;show()">${st.hp<=0?"Xem kết quả":"Tiếp tục"}</button></div>`);
 $(".fb .go").focus()}
function pickC(k){
 if(st.lock)return;const q=st.q,a=q.o[k],ok=a===q.a;
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.o[j]===q.a)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
 res(ok,q,q.tip)}
function drawO(){const q=st.q;
 $("#ans").innerHTML=st.pk.map(k=>`<button class="chip" onclick="st.pk=st.pk.filter(x=>x!=${k});drawO()">${q.w[k]}</button>`).join("");
 $("#pool").innerHTML=q.w.map((w,k)=>st.pk.includes(k)?"":`<button class="chip" onclick="st.pk.push(${k});drawO()">${w}</button>`).join("")}
function chkO(){
 if(st.lock||st.pk.length<st.q.w.length)return;
 res(st.pk.map(k=>st.q.w[k]).join("")===st.q.a,st.q,st.q.tip)}
function selM(k){if(st.lock)return;document.querySelectorAll("[id^=l]").forEach(b=>b.classList.remove("sel"));st.sel=k;$("#l"+k).classList.add("sel")}
function mtch(k){
 if(st.lock||st.sel===null)return;const b=$("#r"+k);
 if(k===st.sel){b.classList.add("ok");b.disabled=true;$("#l"+k).classList.add("ok");$("#l"+k).disabled=true;st.sel=null;st.n++;
  if(st.n==st.q.p.length)res(st.mm==0,st.q,st.mm?"Hoàn thành, nhưng có "+st.mm+" lần nối sai.":"Nối đúng hết!")}
 else{st.mm++;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),500);if(st.hard){st.hp--;if(st.hp<=0){st.miss.push(st.q);st.lock=true;end()}}}}

/* ===== KẾT QUẢ ===== */
function end(){
 clearInterval(st.iv);const o=st.o,n=st.qs.length,dead=st.hp<=0;
 let s=0;
 if(st.speed)s=st.pts>=250?3:st.pts>=150?2:st.pts>=60?1:0;
 else if(!dead){const a=st.ok/n;s=a>=.9?3:a>=.7?2:a>=.5?1:0}
 if(!o.review){if(o.key&&!st.speed)S.acc[o.key]=Math.max(S.acc[o.key]||0,Math.round(st.ok/n*100));if(o.key&&s>0)S.done[o.key]=Math.max(S.done[o.key]||0,s);if(st.speed)S.best=Math.max(S.best||0,st.pts)}
 S.xp+=st.pts;
 const td=new Date().toDateString();
 if(S.last!==td){S.streak=S.last===new Date(Date.now()-864e5).toDateString()?S.streak+1:1;S.last=td}
 save();
 const miss=st.miss.filter(q=>q.t!="m");
 $("#app").innerHTML=`<div class="res card"><h2>${st.speed?"Hết giờ!":dead?"Hết tim":s>0?"Hoàn thành!":"Chưa đạt"}</h2><div class="stars">${"★".repeat(s)}${"☆".repeat(3-s)}</div>
 <p>${st.speed?`Điểm: <b>${st.pts}</b> (cao nhất ${S.best})`:`Đúng ${st.ok}/${n} · +${st.pts} XP`}</p>
 ${!st.speed&&s==0?"<p>Cần đúng ít nhất một nửa để qua màn.</p>":""}
 ${o.review?"":`<button class="go" onclick="st.o.again()">Chơi lại</button>`}
 ${miss.length&&!o.review?`<button class="go alt" onclick="run(sh(st.miss.filter(q=>q.t!='m')),{review:1,again:home})">Ôn lại ${miss.length} câu sai</button>`:""}
 <br><button class="go alt" onclick="home()">Về bản đồ</button></div>`}
/* ===== HỌC SINH, BÁO CÁO, LÀM LẠI ===== */
function login(){
 const us=Object.keys(DB.users);
 $("#app").innerHTML=`<h1>Chào mừng bạn!</h1><p class="sub">Nhập tên để lưu điểm của riêng bạn.</p><div class="card"><input id="nm" class="inp" maxlength="30" placeholder="Tên học sinh" onkeydown="if(event.key==='Enter')go()"><button class="go" onclick="go()">Bắt đầu học</button>${us.length?`<p>Hoặc chọn tên đã có trên máy này:</p><div class="tools">${us.map((u,i)=>`<button class="tg" onclick="use(Object.keys(DB.users)[${i}]);home()">${u}</button>`).join("")}</div>`:""}</div><button class="tg" onclick="report()">📋 Báo cáo cả lớp</button>`}
function go(){const n=$("#nm").value.trim().replace(/[<>"'&`]/g,"");if(!n){$("#nm").focus();return}use(n);home()}
function rep(u){const d=DB.users[u],c=Object.keys(d.done||{}).filter(k=>k!="u"&&d.done[k]>0).length;return `${u}: ${c}/14 màn đạt · ${d.xp||0} XP · Boss tốc độ ${d.best||0} điểm`}
function report(){
 const L=["BÁO CÁO UNIT 2 (Bài 5 + Bài 6) – "+new Date().toLocaleDateString("vi-VN"),"","TỔNG HỢP CẢ LỚP (các học sinh trên máy này):",...Object.keys(DB.users).map(rep)];
 if(DB.cur){L.push("","CHI TIẾT: "+DB.cur);
  for(const l of [5,6]){L.push("Bài "+l+":");LV[l].forEach((v,i)=>{const k=l+"-"+i,s=S.done[k]||0;L.push(`  ${v[0]}: ${s?"★".repeat(s):"chưa đạt"}${S.acc[k]!=null?" ("+S.acc[k]+"% đúng)":""}`)})}
  L.push("Boss tốc độ: "+(S.best||0)+" điểm")}
 $("#app").innerHTML=`<h1>Báo cáo điểm</h1><p class="sub">Sao chép và gửi cho giáo viên (qua Zalo, email...).</p><div class="card"><textarea id="rp" readonly></textarea><button class="go" onclick="cp()">Sao chép kết quả</button> <span id="cm"></span></div><button class="go alt" onclick="home()">Quay lại</button> <button class="go alt" onclick="clearAll()">Xóa dữ liệu cả máy</button>`;
 $("#rp").value=L.join("\n")}
function cp(){const t=$("#rp");t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}$("#cm").textContent=ok?"Đã sao chép!":"Chưa sao chép được, hãy nhấn giữ và chọn Sao chép."}
function resetMe(){if(confirm("Xóa toàn bộ điểm của "+DB.cur+" và làm lại từ đầu?")){delete DB.users[DB.cur];use(DB.cur);home()}}
function clearAll(){if(confirm("Xóa điểm của TẤT CẢ học sinh trên máy này?")){DB.users={};DB.cur="";save();home()}}
home();
</script></body></html>
